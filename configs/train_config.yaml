# Pre-training setup and success criteria for prompt injection detection (Week 3 / Ladder)
# Locked before training begins.
# Updated: 2026-11-19

# Hardware Environment & Power Limits (Dell G15 5530 on 150W charger)
hardware:
  date: "2026-11-19"
  platform: "Dell G15 5530"
  power_adapter: "150W charger (firmware power-capped)"
  nvidia_smi_power_readings:
    current_power_limit_w: 30.00
    default_power_limit_w: 80.00
    max_power_limit_w: 95.00
  latency_benchmarks:
    original_target_ms: 50.0  # Original unthrottled 80W TDP target
    gpu_kernel_compiled_cuda_events_ms:
      tokens_192_median: 7.84
      tokens_407_median: 23.32
      tokens_512_median: 25.14
    wall_clock_compiled_p5_30w_cap_ms:
      tokens_192_median: 134.5
      tokens_192_p95: 137.0
      tokens_407_median: 202.4
      tokens_407_p95: 208.0
      tokens_512_median: 109.2
      tokens_512_p95: 214.5
    adjusted_criterion_ms: 250.0

# Model & Architecture
model_name: "answerdotai/ModernBERT-base"
pooling: "mean"  # Tested mean vs cls vs max in src/21b_probe_frozen.py; mean demonstrated best overall stability and representation quality
max_len: 512
dtype: "bfloat16"
attn_implementation: "sdpa"
gradient_checkpointing: true

# Training Hyperparameters
batch_size: 32
lr_ce: 2.0e-5
lr_supcon: 1.0e-5
warmup_ratio: 0.06
weight_decay: 0.01
grad_clip: 1.0
epochs: 4
supcon_temp: 0.1
proj_dim: 128
seeds:
  - 42
  - 1337
  - 2026

# Evaluation & Decision Rules
threshold_rule: "val_template_fpr_le_0.01"

# Success Criteria (locked before training)
success_criteria:
  test_real:
    criterion: "paired_bootstrap_lower_bound_gt_zero"
    description: "Paired bootstrap over the 119 distinct sentences (model - tfidf) 95% CI lower bound strictly > 0 (clearly above TF-IDF baseline macro recall of 0.565)"
    baseline_tfidf_macro_recall: 0.565
    n_distinct_sentences: 119
    bootstrap_samples: 2000
    confidence_level: 0.95
  unseen_harmless:
    criterion: "recall_at_fixed_fpr_le_0.01"
    description: "Unseen-harmless FPR comparisons must evaluate recall at fixed <= 1% FPR alongside AUC"
    max_fpr: 0.01
    evaluate_recall_at_fixed_fpr: true
  latency_ms_lt: 250.0  # Adjusted wall-clock ceiling under P5 16.30W/30W cap on 150W charger (original unthrottled 80W TDP target < 50ms; GPU kernel time 7.8–25.1ms is already under 50ms)
